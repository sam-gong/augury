[project]
name = "augury"
version = "0.1.0"
description = "Personal market dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.26,<2.0",
    "plotly>=5.20",
    "jinja2>=3.1",
    "pyarrow>=15.0",
    "fredapi>=0.5",
    "python-dotenv>=1.0",
    "vectorbt>=0.27",
    # Fetcher-side parsers — locally these are usually already present in any
    # pandas-heavy env, but CI runners start clean and need them explicit:
    "openpyxl>=3.1",  # NAAIM exposure, Atlanta Fed wage, BLS rent, NYFed inflation expectations (.xlsx)
    "lxml>=5.0",       # NDFI / S5FI breadth (pandas.read_html on TradingView pages)
    "pypdf>=4.0",      # ISM new-orders / inventories / prices monthly PDF tails
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augury"]
