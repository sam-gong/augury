<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Augury · {% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0a0a; color: #e5e5e5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { background: #111; border: 1px solid #1f1f1f; border-radius: 8px; padding: 16px; }
    .num { font-variant-numeric: tabular-nums; }
    .nav a { color: #999; padding: 4px 12px; border-radius: 4px; transition: all 120ms; }
    .nav a:hover { color: #fff; background: #1f1f1f; }
    .nav a.active { color: #fff; background: #1f1f1f; }
    .up { color: #22c55e; }
    .down { color: #ef4444; }
  </style>
</head>
<body>
  <header class="border-b border-zinc-800 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <h1 class="text-lg font-bold tracking-wider">AUGURY</h1>
      <nav class="nav flex gap-1 text-sm">
        <a href="index.html" class="{% if page == 'index' %}active{% endif %}">大盘</a>
        <a href="strategies.html" class="{% if page == 'strategies' %}active{% endif %}">策略</a>
        <a href="macro.html" class="{% if page == 'macro' %}active{% endif %}">宏观</a>
      </nav>
    </div>
    <div class="text-xs text-zinc-500 num">{{ updated }}</div>
  </header>
  <main class="p-6 max-w-7xl mx-auto">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
