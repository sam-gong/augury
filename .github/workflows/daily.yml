name: daily
on:
  schedule:
    - cron: '0 2 * * *'  # UTC 02:00, post-US close
  workflow_dispatch:
  push:
    paths:
      - 'augury/**'
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - run: python -m augury run
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "auto: $(date -u +%Y-%m-%d)"
          git push
