name: daily
on:
  schedule:
    # UTC 23:17 = 北京 07:17. 错开整点/UTC 午夜的拥堵时段 — GH Actions
    # scheduled run 没有时间保证(常延迟 1-3h),用奇数分钟 + 提前量,
    # 即便延迟也能在上午跑完。美股 EOD(收盘 20-21 UTC)此时已结算。
    - cron: '17 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'augury/**'
      - 'pyproject.toml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -e .
      - run: python -m augury run
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "auto: $(date -u +%Y-%m-%d)"
          git push
